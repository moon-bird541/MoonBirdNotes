name: Feature request
description: 提一个功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        建议先看一眼 `PRODUCT_RULES.md`：那份文档定义了笔记 / 日记 / 标签 / 图片的边界，
        与它冲突的需求需要先改规则再改代码。

  - type: textarea
    id: problem
    attributes:
      label: 现在卡在哪里
      description: 描述你实际遇到的场景，而不是直接给方案。
      placeholder: 我想按「最近 7 天修改过」筛选笔记，现在只能按排序看。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解法
      description: 可以是具体交互，也可以是「只要能达到目的就行」。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 笔记 / 日记
        - 编辑器
        - 图片 / 上传
        - 搜索
        - Knowledge Agent / RAG
        - 部署 / 配置
        - 其他

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 目前是怎么绕过去的？这能帮助判断优先级。
    validations:
      required: false
